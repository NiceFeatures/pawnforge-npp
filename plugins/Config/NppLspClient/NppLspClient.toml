# DIALOG SETTINGS

# Each dialog has the same 4 key-value pairs, foreground_color, background_color, font_name and font_size,
# which, if not set, are inherited from the default style used, in addition,
# the Scinitilla-based dialogs, currently all dockable dialogs, have the option selected_text_color,
# which is inherited from the npp default setting.
# All others are dialog-specific options that have predefined values,
# which of course will not work with all possible themes.

# The values for the WHATEVER_colors must be an integer in the range 0 - 16777215 (0xffffff).
#   The notation is either pure digits or a hex notation starting with 0x
#   and in BGR order like expected by scintilla

# The font_name is a string enclosed in quotation marks such as "Courier New" or "Arial".

# The font_size must be a meaningful integer value.

