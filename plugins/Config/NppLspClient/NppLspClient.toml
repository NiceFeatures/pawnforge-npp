# #########################################################
# LANGUAGE SERVER SETTINGS

# Each configured lanugage server needs to start with a section called
# [lspservers.NAME_OF_THE_LANGUAGE_SERVER] eg. [lspservers.python]
# the NAME_OF_THE_LANGUAGE_SERVER must be the same as displayed in the language menu
# if the name contains non-alphabetic letters like C++, then it needs to be encased in double quotes like
# [lspservers."c++"]

# The following server attributes can be set
# mode - io, tcp or pipe; value encased in a double quotes.
# e.g.  mode = "io"

# executable - the full path to the language server executable encased in SINGLE quotes.
# e.g.  executable = 'D:\\ProgramData\\Python\\Python38_64\\Scripts\\pylsp.exe'

# args - arguments passed to the language server executable encased in SINGLE quotes.
# e.g.  args = '--check-parent-process --log-file D:\\log.txt -vvv'

# env - Additional lsp server process environment variables provided as toml inline table.
# e.g.  env = {RA_LOG = 'lsp_server=trace', RA_LOG_FILE = 'd:\\rust-analyzer.txt'}

# auto_start_server - true or false; Indicates whether the language server will be started automatically when a corresponding document gets opened.
# NOTE: currently only false should be used
# e.g.  auto_start_server = false

# port - this is only effictive and needed if mode is set to tcp and should be an integer
# consult your language server documentation which port should be used or how to configure it.
# e.g. port = 12345

# host - this is only effictive and needed if mode is set to tcp and should be the ip address of the host running the language server
# If language server and client are running on the same host, then 127.0.0.1 might be a good choice.
# e.g. host = 127.0.0.1

# pipe - this is only effictive and needed if mode is set to pipe and should be an string
# consult your language server documentation how this should be used or how to configure it.


# initialization_options - json string; Please check the server documentation to see whether this is supported and,
#  if so, which values can be set.
#  e.g. the rust-analyzer allows to limit to completion suggestion with something like

# initialization_options = '{"completion":{"limit": 1000}}'

# or as a multiline definition

# initialization_options = '''{
# "completion":{
#   "limit": 1000
#  }
# }'''

# workspace_configuration - json string; Please check the server documentation to see whether this is supported and, if so, which values can be set.
#  The value is used in both the DidChangeConfiguration notification and the workspace/configuration request.
#   e.g. the intelephense server allows to load additional stubs with something like

# workspace_configuration = '''{
# 	"intelephense": {
# 		"stubs": [
#             "apache", "bcmath", "bz2", "calendar", "com_dotnet", "Core", "ctype", "curl", "date", "dba", "dom", "enchant", "exif", "FFI", "fileinfo", "filter", "fpm", "ftp", "gd", "gettext", "gmp", "hash", "iconv", "imap", "intl", "json", "ldap", "libxml", "mbstring", "meta", "mysqli", "oci8", "odbc", "openssl", "pcntl", "pcre", "PDO", "pgsql", "Phar", "posix", "pspell", "random", "readline", "Reflection", "session", "shmop", "SimpleXML", "snmp", "soap", "sockets", "sodium", "SPL", "sqlite3", "standard", "superglobals", "sysvmsg", "sysvsem", "sysvshm", "tidy", "tokenizer", "uri", "xml", "xmlreader", "xmlrpc", "xmlwriter", "xsl", "Zend OPcache", "zip", "zlib", "wordpress"
# 		]
# 	}
# }'''

# The following settings can be used to enable or disable the corresponding lsp requests for the configured server.
#  If no corresponding settings have been made in either the general section or the server section,
#   a corresponding request is sent by default.
#  Possible values are true or false(Default).
# disable_completion_request =
# disable_signature_request =
# disable_symbol_request =
# disable_progress_popups =


# request_diagnostics - possible values are 0, 1 and 2
# It is possible that a language server does not implement diagnostic notifications,
#  but does implement diagnostic requests.
# 0 = deactivated, no request is sent (default)
# 1 = on_save, a request is only sent to the server if the current buffer is saved
# 2 = on_modify, every text change triggers a diagnostic request
# e.g. request_diagnostics = 0


# In the following examples WHATEVER_DIRECTORY must be replaced by the complete concrete path in each case.
# Some examples can also be found at https://github.com/Ekopalypse/NppLspClient/blob/main/tips.md#known-working-language-servers-and-their-sample-configuration-in-alphabetical-order

# language server configuration example for io mode
# [lspservers.python]
# mode = "io"
# executable = 'WHATEVER_DIRECTORY\\pylsp.exe'
# args = '--check-parent-process --log-file WHATEVER_DIRECTORY\\log.txt -vvv'
# auto_start_server = false

# language server configuration example for tcp mode
# [lspservers.python]
# mode = "tcp"
# executable = 'WHATEVER_DIRECTORY\\pylsp.exe'
# args = '--tcp --host 127.0.0.1 --port 12345 --check-parent-process --log-file WHATEVER_DIRECTORY\\log.txt -vvv'
# port = 12345
# host = "127.0.0.1"
# auto_start_server = false

# language server configuration example with initialization_options and additional environment variables
# [lspservers.rust]
# mode = "io"
# executable = 'WHATEVER_DIRECTORY\\rust-analyzer.exe'
# env = {RA_LOG = 'lsp_server=trace', RA_LOG_FILE = 'WHATEVER_DIRECTORY\\rust-analyzer.txt'}
# auto_start_server = false
# initialization_options = '{"completion":{"limit": 1000}}'

# PawnForge LSP Servers
[lspservers.pawn]
mode = "io"
executable = 'C:\Program Files\Notepad++\pawnforge-lsp.exe'
args = '--stdio'
auto_start_server = true
initialization_options = '{"includePaths": ["include", "C:/Users/iceeedR/Desktop/compiler/include", "compiler/include"]}'
workspace_configuration = '{"pawnforge": {"includePaths": ["include", "C:/Users/iceeedR/Desktop/compiler/include", "compiler/include"]}}'