[general]
# The indicator IDs defined here are fallback values in case NPPM_ALLOCATEINDICATOR fails.
diag_indicator_id = 12  # Indicator used to draw the squiggle lines
highlight_indicator_id = 13  # Indicator used to highlights all references to the symbol scoped to this file
highlight_indicator_color = 0x64e0ff  # value must be in the range 0 - 0xffffff

# Define only if themes default fore- and background colors should be replaced
calltip_foreground_color = 0xd4d4d4
calltip_background_color = 0x252526

# When both Npps and Lsps completion dialogs are used, this setting determines whether
#  the Lsp completion dialog closes the Npp dialog and displays its own data.
#  Possible values are true or false(Default).
# complete_always =

# NOTE THAT ENABLING LOGGING HAS A MASSIVE IMPACT ON OVERALL PERFORMANCE AND SHOULD ONLY BE USED IF NECESSARY.
enable_logging = false  # value must be either false(Default) or true

# The following settings can be used to disable the corresponding lsp requests for all configured servers.
#  Possible values are true or false(Default).
# disable_completion_request =
# disable_signature_request =
# disable_symbol_request =


