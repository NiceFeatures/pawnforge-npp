# PawnForge LSP Configuration for Notepad++
# NppLspClient plugin (https://github.com/Ekopalypse/NppLspClient)

[general]
diag_indicator_id = 12
error_color = 0x5a5af2
warning_color = 0x48d0e0
incoming_msg_color = 0x7bc399
outgoing_msg_color = 0xffac59
selected_text_color = 0x745227
highlight_indicator_id = 13
highlight_indicator_color = 0x64e0ff
enable_logging = false
clear_reference_view_always = false

# AMX Mod X Pawn Language Server
# Note: You can specify 'pawnforge-lsp.exe' if added to your PATH or placed in Notepad++ directory.
# Or provide the full path enclosed in single quotes, e.g.:
# executable = 'C:\Program Files\Notepad++\bin\pawnforge-lsp.exe'
[lspservers.Pawn]
mode = "io"
executable = 'pawnforge-lsp.exe'
args = '--stdio'
auto_start_server = false
